<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beacon of Light | Daily Verses</title>
    <link rel="stylesheet" href="bolwebstyle.css">
    <style>
        .quote-featured {
            background: linear-gradient(135deg, #13241e 0%, #1f4e3d 65%, #2a634d 100%);
            color: #ffffff;
            border-radius: 20px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px rgba(19, 36, 30, 0.12);
        }
        .quote-featured .tag {
            display: inline-block;
            background: #f4b41a;
            color: #13241e;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .quote-text {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.4;
            margin: 1rem 0 0.5rem;
        }
        .quote-author {
            color: #a7f3d0;
            font-size: 0.98rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        .reactions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .react-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            user-select: none;
            transition: all 0.15s ease;
        }
        .card .react-btn {
            background: #f1f6f4;
            border: 1px solid #d5e3dd;
            color: #1a2b25;
        }
        .react-btn:hover {
            transform: translateY(-2px);
        }
        .react-btn.voted {
            background: #63c78d;
            color: #0e291d;
            border-color: #1f6f54;
        }
        .archive-card {
            border-left: 5px solid #1f6f54;
        }
    </style>
</head>
<body>

<header class="site-header">

        <img src="images/logo.png" alt="">
        <span class="logo-name">BEACON OF LIGHT<span>CHRISTIAN FELLOWSHIP CENTER · VIENNA</span></span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a><a href="about.html">About</a><a href="calendar.html">Calendar</a>
        <a href="bible-study.html">Bible Study</a><a href="hour-of-power.html">Hour of Power</a>
        <details class="nav-more"><summary>More</summary><div class="nav-more-menu">
            <a href="daily-quotes.html">Daily Quotes</a>

            <a href="gallery.html">Gallery</a><a href="contact.html">Contact</a>
        </div></details>

    <div class="theme-switch" role="group" aria-label="Choose a color theme">
        <span class="theme-switch-label">Theme</span>
        <button class="theme-btn" type="button" data-theme-choice="midnight" aria-pressed="true">Midnight &amp; Gold</button>
        <button class="theme-btn" type="button" data-theme-choice="olive" aria-pressed="false">Olive &amp; Clay</button>
    </div>
</header>
    <link rel="icon" href="images/logo.png" type="image/png">

    <div class="container" id="main">
        <div class="page-header">
            <h1>Daily Verses</h1>
            
        </div>

        <!-- Featured Today's Quote (Auto-populated) -->
        <div class="quote-featured" id="featured-quote-box"></div>

        <!-- Previous 6 Days Archive (Auto-populated) -->
        <h2 style="margin-bottom: 1rem; font-size: 1.3rem; color: #13241e;">Recent Daily Reflections</h2>
        <div id="archive-quotes-list"></div>
    </div>

    <footer>
        &copy; 2026 Beacon of Light (BOL). All rights reserved.
    </footer>

    <script src="daily-verses.js"></script>
    <script>
        // Shared verse pool (matches index.html so Today's Quote is always identical on both pages)
            const dailyVerses = (window.BOL_DAILY_VERSES || []).map(function (verse) {
            return Object.assign({ baseAmen: 0, baseLove: 0, baseWord: 0 }, verse);
        });
        if (!dailyVerses.length) throw new Error("The shared daily verse list could not be loaded.");

        function getLocalDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        const today = new Date();
        const todayLocalStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const todayDayNumber = Math.floor(todayLocalStart.getTime() / (1000 * 60 * 60 * 24));

        function buildReactionButtons(dayKey, verseObj) {
            const types = [
                { key: "amen", label: "🙏 Amen", base: verseObj.baseAmen },
                { key: "love", label: "❤️ Love", base: verseObj.baseLove },
                { key: "word", label: "🔥 Word", base: verseObj.baseWord }
            ];

            return types.map(t => {
                const storageId = `bol_react_${dayKey}_${t.key}`;
                const isVoted = localStorage.getItem(storageId) === "true";
                const count = isVoted ? t.base + 1 : t.base;
                return `<button type="button" class="react-btn ${isVoted ? "voted" : ""}"
                            data-storage="${storageId}"
                            onclick="toggleQuoteReact(this)">
                            ${t.label} <span class="count">${count}</span>
                        </button>`;
            }).join("");
        }

        function toggleQuoteReact(button) {
            const storageId = button.dataset.storage;
            const countSpan = button.querySelector(".count");
            let currentCount = parseInt(countSpan.textContent, 10);

            if (button.classList.contains("voted")) {
                button.classList.remove("voted");
                countSpan.textContent = currentCount - 1;
                localStorage.removeItem(storageId);
            } else {
                button.classList.add("voted");
                countSpan.textContent = currentCount + 1;
                localStorage.setItem(storageId, "true");
            }
        }

        // 1. Render Today's Featured Quote
        const todayKey = getLocalDateKey(today);
        const todaysVerse = dailyVerses[todayDayNumber % dailyVerses.length];
        const formattedToday = today.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });

        document.getElementById("featured-quote-box").innerHTML = `
            <span class="tag">✨ Today's Word • ${formattedToday}</span>
            <p class="quote-text">"${todaysVerse.text}"</p>
            <p class="quote-author">— ${todaysVerse.ref}</p>
            <div class="reactions">
                ${buildReactionButtons(todayKey, todaysVerse)}
            </div>
        `;

        // 2. Render Previous 6 Days Automatically
        const archiveContainer = document.getElementById("archive-quotes-list");
        let archiveHtml = "";

        for (let offset = 1; offset <= 6; offset++) {
            const pastDate = new Date(today);
            pastDate.setDate(today.getDate() - offset);

            const pastKey = getLocalDateKey(pastDate);
            const pastLocalStart = new Date(pastDate.getFullYear(), pastDate.getMonth(), pastDate.getDate());
            const pastDayNumber = Math.floor(pastLocalStart.getTime() / (1000 * 60 * 60 * 24));
            const verse = dailyVerses[((pastDayNumber % dailyVerses.length) + dailyVerses.length) % dailyVerses.length];

            const label = offset === 1
                ? "Yesterday"
                : pastDate.toLocaleDateString("en-US", { weekday: "short", month: "long", day: "numeric", year: "numeric" });

            archiveHtml += `
                <div class="card archive-card">
                    <small style="color: #1f6f54; font-weight: 700; text-transform: uppercase;">${label}</small>
                    <p style="font-size: 1.15rem; font-weight: 600; margin: 0.5rem 0; color: #13241e;">"${verse.text}"</p>
                    <p style="color: #5c7068; font-size: 0.9rem; font-weight: 600; margin-bottom: 1rem;">— ${verse.ref}</p>
                    <div class="reactions">
                        ${buildReactionButtons(pastKey, verse)}
                    </div>
                </div>
            `;
        }

        archiveContainer.innerHTML = archiveHtml;
    </script>
    <script src="bolsite.js"></script>
</body>
</html>
