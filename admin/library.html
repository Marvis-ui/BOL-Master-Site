<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Church Library Editor</title><link rel="stylesheet" href="../bolwebstyle.css"><style>main{max-width:850px;margin:2rem auto;padding:1rem}form{display:grid;gap:1rem}label{display:grid;gap:.3rem}input,select,textarea{font:inherit;padding:.7rem;width:100%;box-sizing:border-box}textarea{min-height:130px}button{margin:.4rem 0} [hidden]{display:none!important}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><a href="content.html">Calendar &amp; Bible Study</a> · <a href="sermons.html">Sermons</a> · <a href="hour-of-power.html">Hour of Power</a><h1>Church Library Editor</h1><p>Manage approved public content. This repository is public: never enter private records, even when hidden from the website.</p><form id="login"><label>Editor password<input type="password" id="password" required autocomplete="current-password"></label><button>Sign in</button></form><p id="status" role="status"></p><section id="editor" hidden><button id="logout">Sign out</button><button id="reload">Reload</button><form id="record"><input type="hidden" name="id"><label>Section<select name="kind"><option value="quote">Daily Quotes</option><option value="event">Events</option><option value="archive">Archive</option><option value="hope">Beacon of Hope</option><option value="youth">Youth Portfolio</option></select></label><label>Title<input name="title" required></label><label>Verified date (publication date for quotes)<input name="date" type="date" required></label><label>Description or verse text<textarea name="description"></textarea></label><label>Scripture reference (quotes)<input name="reference"></label><label>Category or document type<input name="category"></label><label>Approved youth display name (portfolio only)<input name="name"></label><label>Document, Google Photos album or project HTTPS URL<input name="url" type="url"></label><label>Website visibility<select name="visibility"><option value="public">Published</option><option value="hidden">Hidden from website (still public in repository)</option></select></label><button>Preview</button><button type="button" id="new">New entry</button></form><section id="review" hidden><h2>Confirm record</h2><pre id="preview"></pre><label style="display:flex"><input style="width:auto" type="checkbox" id="approved"> I checked the date, content, sharing permissions and consent; this is safe for public access.</label><button id="publish">Confirm and save</button></section><h2>Existing records</h2><div id="records"></div></section></main><script>
const $=id=>document.getElementById(id);let revision=null,pending=null;
const status=t=>$("status").textContent=t;
async function api(action,extra={}){const r=await fetch("/api/sermons",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,...extra})});const j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j;}
function resetPreview(){pending=null;$("review").hidden=true;$("approved").checked=false;}
function show(j){revision=j.revision;$("records").replaceChildren();for(const row of j.records){const b=document.createElement("button");b.type="button";b.textContent=row.kind+" · "+row.date+" · "+row.title+" · "+row.visibility;b.onclick=()=>{resetPreview();$("record").reset();for(const [k,v] of Object.entries(row)){const f=$("record").elements.namedItem(k);if(f)f.value=v;}};$("records").append(b,document.createElement("br"));}}
async function load(){resetPreview();revision=null;try{show(await api("library-load"));status("Records loaded.");}catch(e){status(e.message);}}
async function enter(){$("login").hidden=true;$("editor").hidden=false;await load();}
$("login").onsubmit=async e=>{e.preventDefault();try{await api("login",{password:$("password").value});$("password").value="";await enter();}catch(e){status(e.message);}};
$("logout").onclick=async()=>{try{await api("logout");revision=null;resetPreview();$("editor").hidden=true;$("login").hidden=false;}catch(e){status(e.message);}};
$("reload").onclick=load;$("new").onclick=()=>{$("record").reset();$("record").elements.id.value="";resetPreview();};
$("record").oninput=resetPreview;$("record").onsubmit=e=>{e.preventDefault();if(!revision)return status("Reload records first.");const row=Object.fromEntries(new FormData(e.target));row.id=row.id||crypto.randomUUID();pending=row;$("preview").textContent=Object.entries(row).map(([k,v])=>k+": "+v).join("\n");$("review").hidden=false;};
$("publish").onclick=async()=>{if(!pending||!$("approved").checked)return status("Confirm public access review first.");$("publish").disabled=true;try{const j=await api("library-save",{record:pending,revision,approved:true});show(j);resetPreview();$("record").reset();$("record").elements.id.value="";status(j.message);}catch(e){status(e.message);}finally{$("publish").disabled=false;}};
(async()=>{try{if((await api("session")).authenticated)await enter();}catch(e){status(e.message);}})();
</script></body></html>
