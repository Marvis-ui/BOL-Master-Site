<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Hour of Power Editor | BOL</title><link rel="stylesheet" href="../bolwebstyle.css"><style>main{max-width:850px;margin:2rem auto;padding:1rem}section{background:var(--surface-raised);padding:1.5rem;border:1px solid var(--line);border-radius:16px;margin-bottom:1rem}form{display:grid;gap:1rem}label{display:grid;gap:.35rem;font-weight:600}input,textarea,select{font:inherit;padding:.65rem;border:1px solid var(--line);border-radius:8px;background:var(--surface-raised);color:var(--ink);width:100%;box-sizing:border-box}textarea{min-height:90px}button{cursor:pointer} [hidden]{display:none!important}#records button{display:block;margin:.5rem 0;text-align:left}#status{white-space:pre-wrap;font-weight:600}</style></head><body><main><p><a href="content.html">Church Content Editor — Calendar &amp; Bible Study</a></p><a href="../hour-of-power.html">← Hour of Power</a><h1>Hour of Power editor</h1><p>Publish weekly devotionals and quotes. Use the existing church editor password.</p><section id="login"><form id="login-form"><label>Editor password<input type="password" id="password" required autocomplete="current-password"></label><button class="button-primary">Sign in</button></form></section><p id="status" role="status" aria-live="polite"></p><section id="editor" hidden><button type="button" class="button-secondary" id="logout">Sign out</button><h2 id="heading">New devotional or quote</h2><form id="record-form"><label>Content type<select name="kind"><option value="devotional">Devotional</option><option value="quote">Weekly quote</option></select></label><label>Date<input name="date" type="date" required></label><label>Topic / title<input name="title" maxlength="300"></label><label>Scripture reference<input name="scripture" maxlength="300"></label><label>Quote<textarea name="quote" maxlength="10000"></textarea></label><label>Speaker<input name="speaker" maxlength="300"></label><label>Theme<input name="theme" maxlength="300"></label><label>Introduction / story<textarea name="story" maxlength="50000"></textarea></label><label>Key lessons (one per line)<textarea name="lessons"></textarea></label><label>Reference title<input name="referenceTitle" maxlength="300"></label><label>Reference URL<input name="referenceUrl" type="url" maxlength="2000"></label><button id="publish" class="button-primary">Publish content</button><button id="new" type="button" class="button-secondary">New record</button></form><h2>Existing records</h2><div id="records"></div></section></main><script>
"use strict";
const el=id=>document.getElementById(id),form=el("record-form");let records=[],revision=null,id=null,busy=false;
const status=t=>el("status").textContent=t;
async function api(action,extra={}){const r=await fetch("/api/sermons",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d;}
function fresh(){form.reset();id=null;form.elements.date.value=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Vienna",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());el("heading").textContent="New devotional or quote";}
function render(){const host=el("records");host.replaceChildren();records.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{const b=document.createElement("button");b.type="button";b.className="button-secondary";b.textContent=r.date+" · "+(r.title||r.quote.slice(0,70));b.onclick=()=>{id=r.id;for(const key of ["kind","date","title","scripture","quote","speaker","theme","story","referenceTitle","referenceUrl"])form.elements[key].value=r[key]||"";form.elements.lessons.value=(r.lessons||[]).join("\n");el("heading").textContent="Edit "+r.kind;form.scrollIntoView({block:"start"});};host.append(b);});if(!records.length)host.textContent="No records published yet.";}
async function load(){const d=await api("hop-load");records=d.records;revision=d.revision;render();fresh();el("login").hidden=true;el("editor").hidden=false;}
el("login-form").onsubmit=async e=>{e.preventDefault();try{await api("login",{password:el("password").value});el("password").value="";await load();status("Signed in.");}catch(e){status(e.message);}};
el("logout").onclick=async()=>{try{await api("logout");location.reload();}catch(e){status(e.message);}};
el("new").onclick=fresh;
form.onsubmit=async e=>{e.preventDefault();if(busy||!revision)return;const record=Object.fromEntries(new FormData(form));record.id=id||crypto.randomUUID();record.lessons=record.lessons.split("\n").map(x=>x.trim()).filter(Boolean);if(!confirm("Publish this "+record.kind+" to the church website?"))return;busy=true;el("publish").disabled=true;status("Saving…");try{const d=await api("hop-save",{record,revision});records=d.records;revision=d.revision;render();fresh();status(d.message);}catch(e){status(e.message);}finally{busy=false;el("publish").disabled=false;}};
(async()=>{try{if((await api("session")).authenticated)await load();}catch(e){status(e.message);}})();
</script></body></html>
